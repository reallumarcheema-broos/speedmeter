# nginx reverse proxy for SpeedMeter.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/speedmeter
#   sudo ln -s /etc/nginx/sites-available/speedmeter /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d speedmeter.example.com

server {
    listen 80;
    server_name speedmeter.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name speedmeter.example.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/speedmeter.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/speedmeter.example.com/privkey.pem;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The measurement endpoints. Every directive here matters:
    #   proxy_buffering off         - stream to the client, or the test
    #                                 measures nginx rather than the network
    #   proxy_request_buffering off - same in the upload direction
    #   client_max_body_size 0      - the default 1m would reject the 8 MiB
    #                                 upload chunks outright
    #   gzip off                    - the payload is random and incompressible
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;
        client_max_body_size    0;
        gzip                    off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
